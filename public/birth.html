<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0d">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Labor Support</title>
<link rel="manifest" href="/birth.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0f0d'/%3E%3Cpath d='M16 25C10 20.5 7 17.6 7 14.2 7 11.3 9.2 9.2 12 9.2c1.7 0 3.2.8 4 2.1.8-1.3 2.3-2.1 4-2.1 2.8 0 5 2.1 5 5 0 3.4-3 6.3-9 10.8z' fill='%23c49a3c'/%3E%3C/svg%3E">
<style>
/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0c0f0d}
:root{
  --bg:#0c0f0d; --bg2:#121814; --card:#161e19; --card2:#1b2520;
  --line:#2a3831; --line2:#3a4c42;
  --fg:#e2e9e2; --dim:#8fa295; --faint:#5e6f65;
  --gold:#c9a24a; --yes:#7cae66; --maybe:#a294c9; --veto:#d06a6a;
  --pad: env(safe-area-inset-bottom, 0px);
}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:17px; line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
  padding-bottom:calc(96px + var(--pad));
  transition:none;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em}
.wrap{max-width:720px;margin:0 auto;padding:0 12px}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{font-size:13px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand.open{font-size:19px;letter-spacing:0;text-transform:none;color:var(--gold);font-weight:700}
.modes{display:flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden}
.modes button{padding:11px 15px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--dim);background:var(--bg2)}
.modes button[aria-pressed="true"]{background:var(--card2);color:var(--gold)}
.iconbtn{padding:11px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--bg2);color:var(--dim);font-size:13px;font-weight:700;letter-spacing:.08em}

/* ---------- veto box ---------- */
.vetobox{
  border:1px solid var(--veto);border-radius:14px;background:#1d1414;
  padding:12px 14px;margin:14px 0;
}
.vetobox h2{font-size:12px;letter-spacing:.18em;color:var(--veto);text-transform:uppercase;margin-bottom:8px}
.vetolist{margin:0;padding:0;list-style:none}
.vetolist li{font-size:17px;font-weight:600;padding:3px 0 3px 18px;position:relative;color:#f0d9d9}
.vetolist li:before{content:"\00d7";position:absolute;left:0;color:var(--veto);font-weight:700}
.vetoempty{color:var(--faint);font-size:15px;font-style:italic}
.vetoinputs{display:grid;gap:8px;margin-top:4px}
.vetoinputs input{
  background:#241818;border:1px solid #4a2c2c;border-radius:10px;
  padding:13px 12px;font-size:16px;width:100%;
}
.vetoinputs input::placeholder{color:#7c6060}
.vetobar{
  display:flex;flex-wrap:wrap;gap:2px 9px;align-items:baseline;
  border:1px solid #5a2f2f;border-left:4px solid var(--veto);border-radius:10px;
  background:#1b1313;padding:8px 11px;margin:10px 0 2px;font-size:14px;line-height:1.28;
}
.vetobar b{font-size:11px;letter-spacing:.16em;color:var(--veto)}
.vetobar span{font-weight:600;color:#f0d9d9}
.vetobar span+span:before{content:"\00b7";color:var(--veto);margin-right:9px}
.vetobar.empty{color:var(--faint);font-style:italic;font-size:13.5px}

/* ---------- trigger grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.grid .trig{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  min-height:104px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:5px;
}
.grid .trig:active{background:var(--card2)}
.grid .trig .ic{font-size:21px;line-height:1}
.grid .trig .tn{font-size:17px;font-weight:700;line-height:1.2}
.grid .trig .ts{font-size:13px;color:var(--dim);line-height:1.25}

/* ---------- items ---------- */
.trighead{padding:16px 2px 6px}
.trighead h2{font-size:23px;color:var(--gold);line-height:1.15}
.trighead .sub{font-size:14px;color:var(--dim);margin-top:3px}
.rule{
  margin:8px 0 2px;padding:10px 12px;border-radius:12px;
  background:#1a1710;border:1px solid #453a1d;color:#e8d5a4;
  font-size:14.5px;font-weight:600;line-height:1.32;
}
.item{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;margin:9px 0;
}
.item .nm{font-size:19px;font-weight:700;line-height:1.25;display:flex;gap:8px;align-items:baseline}
.item .how{font-size:16px;color:#cfdacf;margin-top:5px;line-height:1.42}
.item .got{
  font-size:14.5px;color:#e0c98d;margin-top:7px;padding-left:11px;
  border-left:2px solid #6a5a2c;line-height:1.4;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--yes);flex:0 0 auto;margin-top:6px}
.dot.m{background:var(--maybe)}
.morebtn{
  display:block;width:100%;text-align:center;padding:14px;margin:8px 0 0;
  color:var(--faint);font-size:14px;letter-spacing:.08em;border:1px dashed var(--line2);border-radius:12px;
}
.none{color:var(--dim);padding:18px 4px;font-size:16px}

/* ---------- prep mode ---------- */
.prepnote{color:var(--dim);font-size:15px;margin:14px 2px;line-height:1.4}
.tally{display:flex;gap:14px;font-size:13px;color:var(--dim);margin:0 2px 10px;letter-spacing:.04em}
.tally b{color:var(--fg)}
.marks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}
.marks button{
  text-align:center;padding:13px 4px;border-radius:11px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--dim);font-size:12.5px;font-weight:700;letter-spacing:.1em;
}
.marks button[aria-pressed="true"][data-m="yes"]{background:#1c2c18;border-color:var(--yes);color:var(--yes)}
.marks button[aria-pressed="true"][data-m="maybe"]{background:#211d2c;border-color:var(--maybe);color:var(--maybe)}
.marks button[aria-pressed="true"][data-m="veto"]{background:#2c1818;border-color:var(--veto);color:var(--veto)}
.item.vetoed{opacity:.45}
.item.vetoed .how,.item.vetoed .got{display:none}
.trigtags{font-size:12px;color:var(--faint);margin-top:9px;letter-spacing:.03em}

/* ---------- bottom bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#101613;border-top:1px solid var(--line2);
  padding:8px 10px calc(8px + var(--pad));
}
.barin{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:stretch}
.bar button{
  border:1px solid var(--line2);border-radius:13px;background:var(--card);
  padding:14px 12px;font-size:14px;font-weight:700;letter-spacing:.06em;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;
}
.bar .back{flex:1.1;color:var(--gold)}
.bar .pee{flex:1.3;font-variant-numeric:tabular-nums}
.bar .job{flex:1}
.bar button:active{background:var(--card2)}
.pee.due{background:#2e2410;border-color:var(--gold);color:#f0d59a;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
.hidden{display:none !important}
body:has(.bar.hidden){padding-bottom:28px}

/* ---------- my job sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:rgba(4,7,5,.72);
  display:flex;align-items:flex-end;
}
.sheetin{
  width:100%;max-height:82vh;overflow:auto;background:var(--bg2);
  border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  padding:16px 14px calc(20px + var(--pad));
}
.sheetin h2{font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin:14px 2px 8px}
.sheetin h2:first-child{margin-top:0}
.chk{
  display:flex;gap:12px;align-items:flex-start;width:100%;
  padding:13px 12px;margin:7px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);
  font-size:16px;line-height:1.35;
}
.chk .bx{
  width:24px;height:24px;flex:0 0 auto;border:2px solid var(--line2);border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--yes);margin-top:1px;
}
.chk[aria-pressed="true"]{color:var(--faint)}
.chk[aria-pressed="true"] .bx{border-color:var(--yes)}
.chk .sm{display:block;font-size:13.5px;color:var(--dim);margin-top:2px}
.chk[aria-pressed="true"] .sm{color:var(--faint)}
/* pinned to the bottom of the sheet so they stay in the thumb zone
   no matter how far the checklist has been scrolled */
.rowbtns{
  display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;
  background:var(--bg2);padding-top:8px;
}
.rowbtns+.rowbtns{margin-top:0;padding-bottom:2px}
.rowbtns button{
  flex:1;text-align:center;padding:14px;border:1px solid var(--line2);border-radius:12px;
  background:var(--card);font-size:14px;font-weight:700;letter-spacing:.06em;
}
.closebtn{color:var(--gold)}

/* ---------- print ---------- */
#sheetprint{display:none}
@media print{
  @page{size:letter portrait;margin:.34in .32in}
  html,body{background:#fff !important;color:#000 !important}
  body{padding:0 !important;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .top,.bar,.sheet,#app,.noprint{display:none !important}
  #sheetprint{display:block !important;font-size:8.3pt;line-height:1.25;color:#000}
  #sheetprint .pg2{break-before:page;page-break-before:always;padding-top:2pt}
  #sheetprint .ph{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1.5pt solid #000;padding-bottom:2pt;margin-bottom:4pt;
  }
  #sheetprint .ph b{font-size:12pt;letter-spacing:.06em}
  #sheetprint .ph span{font-size:7.6pt;letter-spacing:.04em}
  #sheetprint .pveto{border:1.6pt solid #000;padding:4pt 6pt;margin-bottom:5pt}
  #sheetprint .pveto b{font-size:9.5pt;letter-spacing:.1em;display:block;margin-bottom:1pt}
  #sheetprint .pveto ul{margin:0;padding-left:12pt}
  #sheetprint .pveto li{font-size:10pt;font-weight:700}
  #sheetprint .prule{border:.8pt solid #000;padding:3pt 5pt;margin-bottom:5pt;font-size:8.8pt;font-weight:700}
  #sheetprint .prule span{display:block;font-weight:400;font-size:8.2pt}
  #sheetprint .cols{column-count:2;column-gap:14pt;column-rule:.4pt solid #999}
  #sheetprint .blk{break-inside:avoid;page-break-inside:avoid;margin-bottom:5pt}
  #sheetprint .blk h3{
    font-size:9pt;letter-spacing:.05em;text-transform:uppercase;
    border-bottom:.8pt solid #000;margin:0 0 1.5pt;padding-bottom:.8pt;
  }
  #sheetprint .blk .nt{font-size:7.8pt;font-style:italic;margin:0 0 1.5pt}
  #sheetprint .blk p{margin:0 0 2.2pt}
  #sheetprint .blk p b{font-weight:700}
  #sheetprint .jobs{break-inside:avoid;border:1.2pt solid #000;padding:3pt 5pt;margin-bottom:5pt}
  #sheetprint .jobs b{font-size:9pt;letter-spacing:.06em}
  #sheetprint .jobs p{margin:1pt 0}
  #sheetprint .ft{margin-top:4pt;border-top:.8pt solid #000;padding-top:2pt;font-size:7.2pt;text-align:center}
}
</style>

<style>
/* ---------- sync status ---------- */
.syncbar{
  max-width:720px;margin:6px auto 0;font-size:11.5px;letter-spacing:.09em;
  color:var(--faint);text-transform:uppercase;display:flex;gap:7px;align-items:center;
}
.syncbar .d{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.syncbar.ok .d{background:var(--yes)} .syncbar.busy .d{background:var(--gold)}
.syncbar.off .d{background:var(--faint)} .syncbar.err .d{background:var(--veto)}
.syncbar button{margin-left:auto;color:var(--gold);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase}

/* ---------- wizard ---------- */
.chapter{margin:20px 0 6px;font-size:11.5px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.steplist{display:grid;gap:8px}
.steprow{
  display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;
  border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16.5px;font-weight:600;
}
.steprow:active{background:var(--card2)}
.steprow .ring{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--yes);
}
.steprow.done .ring{border-color:var(--yes)}
.steprow.part .ring{border-color:var(--gold);color:var(--gold)}
.steprow .cnt{margin-left:auto;font-size:12.5px;color:var(--faint);font-weight:600;letter-spacing:.04em}
.bigbtn{
  display:block;width:100%;text-align:center;padding:18px;margin:16px 0 4px;border-radius:15px;
  background:#1b2a1c;border:1px solid var(--yes);color:#cfe8c4;font-size:16px;font-weight:700;letter-spacing:.06em;
}
.ghostbtn{
  display:block;width:100%;text-align:center;padding:15px;margin:10px 0;border-radius:13px;
  border:1px solid var(--line2);background:var(--card);color:var(--dim);font-size:14.5px;font-weight:700;letter-spacing:.06em;
}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0 12px}
.prog i{display:block;height:100%;background:var(--gold)}
.stepno{font-size:11.5px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin:14px 0 3px}
.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stephead .stepno{padding:4px 0}
#btnJump{color:var(--gold)}
.steptitle{font-size:25px;color:var(--gold);line-height:1.15;margin-bottom:4px}
.blurb{font-size:15px;color:var(--dim);line-height:1.42;margin:6px 0 4px}

.q{border-top:1px solid var(--line);padding:16px 0 4px;margin-top:12px}
.q:first-of-type{border-top:0}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qhead .qt{font-size:18px;font-weight:700;line-height:1.3;flex:1}
.star{
  flex:0 0 auto;width:44px;height:44px;margin:-10px -8px 0 0;border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--faint);
}
.star[aria-pressed="true"]{color:var(--gold)}
.opts{display:grid;gap:7px;margin-top:10px}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;padding:13px 13px;
  border:1px solid var(--line);border-radius:13px;background:var(--card);
  font-size:16px;line-height:1.32;
}
.opt .bx{
  width:22px;height:22px;flex:0 0 auto;border:2px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--yes);margin-top:1px;
}
.opt.radio .bx{border-radius:50%}
.opt.check .bx{border-radius:6px}
.opt[aria-pressed="true"]{background:#1b2a1c;border-color:var(--yes)}
.opt[aria-pressed="true"] .bx{border-color:var(--yes)}
.enterinput,.entertext{
  width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;
  padding:14px 13px;font-size:16px;margin-top:10px;line-height:1.4;
}
.entertext{min-height:96px;resize:vertical}
.enterinput::placeholder,.entertext::placeholder{color:var(--faint)}

.optrow{display:flex;gap:6px;align-items:stretch}
.optrow .opt{flex:1}
.ostar{
  flex:0 0 auto;width:50px;border:1px solid var(--line);border-radius:13px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--faint);
}
.ostar[aria-pressed="true"]{color:var(--gold);border-color:#5a4a20;background:#241f10}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px;letter-spacing:.02em}
.notice{
  border:1px solid var(--gold);border-left:4px solid var(--gold);border-radius:13px;
  background:#241f10;padding:13px 14px;margin:14px 0;font-size:15px;line-height:1.42;color:#f0dca6;
}
.notice b{color:#fff2cf}
.notice .linkbox{margin-top:9px}
.notice .rowbtns{position:static;background:none;padding:0;margin-top:11px}
.memberlist{margin-bottom:12px}
.member{
  display:flex;align-items:center;gap:10px;padding:12px 13px;margin:7px 0;
  border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15.5px;
}
.member span{flex:1;word-break:break-all}
.member i{font-style:normal;font-size:11.5px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.member button{color:var(--veto);font-size:13px;font-weight:700;letter-spacing:.06em;padding:6px 2px}
.err{color:var(--veto);font-size:14px;margin-top:9px;line-height:1.35}
.syncbar.out .d{background:var(--gold)}
.starred{margin:14px 0}
.starred .s{
  display:flex;gap:9px;padding:11px 13px;margin:7px 0;border-radius:12px;
  background:#241f10;border:1px solid #574722;color:#f0dca6;font-size:15.5px;line-height:1.35;
}
.answered{font-size:14px;color:var(--dim);margin-top:9px;line-height:1.4}
.answered b{color:#cfdacf;font-weight:600}

/* ---------- custom content (add / reword) ---------- */
.item{position:relative}
.editpen{position:absolute;top:5px;right:6px;padding:9px 11px;color:var(--faint);font-size:15px}
.item:has(.editpen) .nm{padding-right:32px}
.addlink{display:block;width:100%;text-align:center;padding:12px;margin:10px 0 2px;
  color:var(--faint);font-size:13.5px;letter-spacing:.06em;border:1px dashed var(--line2);border-radius:12px}
.yours{font-style:normal;font-size:10.5px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-left:6px}
select.enterinput{appearance:none;-webkit-appearance:none}
.edlabel{font-size:12.5px;color:var(--faint);letter-spacing:.06em;margin:12px 2px 0;text-transform:uppercase}

/* ---------- wave timer ---------- */
.wavetile{display:flex;flex-direction:column;gap:5px;width:100%;margin:14px 0 -4px;
  background:#241f10;border:1px solid #574722;border-radius:16px;padding:14px;text-align:left}
.wavetile:active{background:#2c2614}
.wavetile .ic{font-size:21px;line-height:1;color:var(--gold)}
.wavetile .tn{font-size:17px;font-weight:700;color:#f0dca6}
.wavetile .ts{font-size:13px;color:var(--dim);line-height:1.25}
.wavebig{display:block;width:100%;text-align:center;padding:22px 14px;margin:14px 0;
  border-radius:16px;background:#1b2a1c;border:1px solid var(--yes);color:#cfe8c4;
  font-size:17px;font-weight:700;letter-spacing:.06em}
.wavebig:active{background:#233623}
.wavebig.end{background:#241f10;border-color:var(--gold);color:#f0dca6}
.wavehero{text-align:center;padding:6px 0 0}
.pacer{width:110px;height:110px;margin:14px auto 6px;position:relative}
.pacer i{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 42%, #e8cf8f, #c9a24a 62%, #6e5820);
  opacity:.92;animation:pace 8s ease-in-out infinite}
@keyframes pace{0%,100%{transform:scale(.55)}45%,55%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pacer i{animation:none;transform:scale(.8)}}
.pacecap{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.waveclock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:8px;line-height:1.1}
.wavesub{font-size:14px;color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.wavehint{font-size:15px;color:var(--dim);margin:8px auto 0;max-width:340px;line-height:1.4}
.wavecard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin:10px 0;font-size:15.5px;line-height:1.45}
.wavecard>b{color:#f0dca6;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.wavecard p{margin:6px 0 0}
.wavecard .dim{color:var(--dim);font-size:14px}
.restclock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.wavelog{width:100%;border-collapse:collapse;font-size:14px;margin-top:2px}
.wavelog td{padding:7px 4px;border-top:1px solid var(--line);color:#cfdacf;font-variant-numeric:tabular-nums}

.wavelog td:last-child{text-align:right;color:var(--dim)}

/* ---------- modal ---------- */
.modalin{
  width:100%;max-height:86vh;overflow:auto;background:var(--bg2);
  border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
  padding:18px 15px calc(20px + var(--pad));
}
.modalin h2{font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.modalin p{font-size:15px;color:var(--dim);line-height:1.45;margin:0 0 12px}
.pickbtn{
  display:block;width:100%;text-align:left;padding:16px 15px;margin:9px 0;border-radius:14px;
  border:1px solid var(--line2);background:var(--card);font-size:17px;font-weight:700;
}
.pickbtn span{display:block;font-size:13.5px;color:var(--dim);font-weight:400;margin-top:3px;line-height:1.35}
.linkbox{
  background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px;
  font-size:13px;word-break:break-all;color:#cfdacf;line-height:1.4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

  body[data-print="plan"] #sheetprint{display:none !important}
  body[data-print="plan"] #planprint{
    display:block !important;font-size:8.3pt;line-height:1.27;color:#000;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;

  #planprint .ph{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1.5pt solid #000;padding-bottom:3pt;margin-bottom:5pt}

  #planprint .ph span{font-size:8pt}

  #planprint .sec p{margin:0 0 1.6pt;padding-left:8pt;text-indent:-8pt}
  #planprint .sec p:before{content:"\2022  "}
  #planprint .sec .free{padding-left:0;text-indent:0;font-style:italic}

  #planprint .close{margin-top:6pt;border-top:.8pt solid #000;padding-top:4pt;font-size:8.6pt;font-style:italic}
  #planprint .ft{margin-top:3pt;font-size:7pt;text-align:center;color:#444}
}

<body>

<header class="top noprint">
  <div class="topin">
    <div class="brand" id="brand">Labor support</div>
    <div class="modes" role="group" aria-label="Mode">
      <button id="mPlan" aria-pressed="true">PLAN</button>
      <button id="mRoom" aria-pressed="false">ROOM</button>
    </div>
    <button class="iconbtn" id="btnPrint" title="Print">PRINT</button>
  </div>
  <div class="syncbar" id="syncBar"></div>
</header>

<main id="app" class="wrap"></main>

<nav class="bar noprint">
  <div class="barin">
    <button class="back hidden" id="btnBack">&#9664; BACK</button>
    <button class="next hidden" id="btnNext">NEXT &#9654;</button>
    <button class="pee" id="btnPee">PEE TIMER</button>
    <button class="job" id="btnJob">MY JOB</button>
  </div>
</nav>

<div class="sheet hidden" id="jobSheet"></div>
<div class="sheet hidden" id="modal"></div>
<div id="sheetprint"></div>
<div id="planprint"></div>

<script src="/birth-content.js"></script>

<script>
/* =====================================================================
   APP — no dependencies, no build step. Works with no network.
   ===================================================================== */
(function () {
  "use strict";

  var DOC_KEY = "birth.doc";     // synced: marks, plan answers, vetoes, stars
  var LOC_KEY = "birth.local";   // this device only: place, checklist, timer
  var OLD_KEY = "birth.v1";      // pre-sync format

  var BY = {};
  ITEMS.forEach(function (i) { BY[i.id] = i; });
  var SECT = {};
  PLAN.forEach(function (s) { SECT[s.id] = s; });

  var STEPS = PLAN.map(function (s) {
    return { kind: "plan", id: s.id, title: s.title, blurb: s.blurb, qs: s.qs };
  }).concat(TRIAGE.map(function (t) {
    return { kind: "triage", id: t.id, title: t.title, cats: t.cats };
  }));
  var PLAN_STEPS = PLAN.length;

  /* ---------------- state ----------------
     D is the synced document: { section: { field: {v, t} } }. Every write
     stamps a timestamp so two phones merge per field instead of one
     overwriting the other wholesale. */
  var D = { marks: {}, plan: {}, vetoes: {}, stars: {}, custom: {} };
  // Every field must be listed: the loader below copies the keys of this
  // object, so anything missing here silently fails to survive a reload.
  var L = {
    mode: "plan", trig: null, step: null, jobs: {}, peeStart: null,
    waves: [],          // contraction log for this device: [{s,e}, ...]
    waveOn: null,       // start of the wave being timed right now, or null
    account: null,      // last known signed-in identity, so offline doesn't look signed out
    mergedWith: null,   // whose plan this phone has already reconciled against
    authMsg: null       // one-shot message from the sign-in redirect
  };

  function readJSON(k) {
    try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; }
  }
  function writeJSON(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }

  (function load() {
    var d = readJSON(DOC_KEY);
    if (d && typeof d === "object") {
      ["marks", "plan", "vetoes", "stars", "custom"].forEach(function (s) {
        if (d[s] && typeof d[s] === "object") D[s] = d[s];
      });
    }
    var l = readJSON(LOC_KEY);
    if (l && typeof l === "object") for (var k in L) if (l[k] != null) L[k] = l[k];
    if (L.mode === "prep") L.mode = "plan";   // List mode retired; Plan covers it

    // one-time carry-over from the pre-sync version
    var old = readJSON(OLD_KEY);
    if (old && !d) {
      var t = Date.now() - 1;   // older than anything typed from here on
      if (old.marks) for (var id in old.marks) D.marks[id] = { v: old.marks[id], t: t };
      if (Array.isArray(old.vetoes)) old.vetoes.forEach(function (v, i) {
        if (v) D.vetoes[String(i)] = { v: v, t: t };
      });
      if (old.jobs) L.jobs = old.jobs;
      if (old.peeStart != null) L.peeStart = old.peeStart;
      saveDoc();
    }
  })();

  function saveDoc() { writeJSON(DOC_KEY, D); }
  function saveLoc() { writeJSON(LOC_KEY, L); }

  function get(sec, key, dflt) {
    var leaf = D[sec] && D[sec][key];
    return leaf ? leaf.v : dflt;
  }
  function set(sec, key, val) {
    if (!D[sec]) D[sec] = {};
    if (val === undefined || val === null || val === "" ||
        (Array.isArray(val) && !val.length)) {
      D[sec][key] = { v: null, t: Date.now() };   // tombstone, so a clear syncs too
    } else {
      D[sec][key] = { v: val, t: Date.now() };
    }
    saveDoc();
    schedulePush();
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ---------------- account + sync ----------------
     Identity comes from signing in with Google. There is no key, no secret
     link, and nothing to lose: the server resolves your plan from your
     membership. Signed out, the tool still works completely -- it just keeps
     everything on this phone. */
  var A = { signedIn: false, configured: true, email: null, role: null, members: [] };
  var sync = { state: "idle", pending: false, timer: null, busy: false, decided: false };
  var pendingRemote = null;

  if (L.account && L.account.email) {
    // Assume the last known session until the server says otherwise, so a
    // dead hospital network doesn't make the UI claim you're signed out.
    A.signedIn = true; A.email = L.account.email; A.role = L.account.role || "member";
  }

  function api(path, opts) {
    return fetch(path, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts || {}));
  }

  function docHasContent(d) {
    for (var s2 in d) for (var k in d[s2]) {
      var leaf = d[s2][k];
      if (leaf && leaf.v !== null && leaf.v !== undefined && leaf.v !== "" &&
          !(Array.isArray(leaf.v) && !leaf.v.length)) return true;
    }
    return false;
  }

  function setSync(state, label) {
    sync.state = state;
    var bar = document.getElementById("syncBar");
    bar.className = "syncbar " + state;
    bar.innerHTML = '<span class="d"></span><span>' + esc(label) + "</span>" +
      '<button id="btnAccount">' + (A.signedIn ? "Account" : "Sign in") + "</button>";
  }

  function signedOutLabel() {
    return A.configured === false
      ? "Sign-in not set up — saved on this phone"
      : "Not signed in — saved on this phone";
  }

  function refreshAccount() {
    return api("/api/birth/auth/me")
      .then(function (r) { return r.json(); })
      .then(function (j) {
        A = {
          signedIn: !!j.signedIn, configured: j.configured !== false,
          email: j.email || null, role: j.role || null, members: j.members || []
        };
        L.account = j.signedIn ? { email: j.email, role: j.role } : null;
        saveLoc();
        return A;
      })
      .catch(function () { return A; });   // offline: keep what we had
  }

  function handleSyncError(e) {
    if (e === 401) {
      A.signedIn = false; L.account = null; saveLoc();
      setSync("out", signedOutLabel());
      render(true);
      return;
    }
    sync.pending = true;
    setSync(e === 503 ? "off" : "err",
      e === 503 ? "Sync unavailable — saved on this phone" : "Not synced — saved on this phone");
  }

  /* The one moment the two copies can genuinely disagree: this phone has
     answers and the shared plan already has some too. Merging silently could
     resurrect a draft nobody meant to share, so ask once. */
  function adopt(remote) {
    if (!sync.decided && L.mergedWith !== A.email &&
        docHasContent(D) && docHasContent(remote)) {
      pendingRemote = remote;
      openImportModal();
      return false;
    }
    sync.decided = true;
    L.mergedWith = A.email; saveLoc();
    if (mergeInto(remote)) renderSafely();
    // Signing in on a phone that already has answers has to send them up.
    // Without this they'd sit here unsynced until the next edit happened to
    // trigger a push -- and on a second phone, never.
    if (docHasContent(D)) schedulePush();
    return true;
  }

  function pull() {
    if (!navigator.onLine) { setSync("off", "Offline — saved on this phone"); return Promise.resolve(); }
    if (!A.signedIn) { setSync("out", signedOutLabel()); return Promise.resolve(); }
    setSync("busy", "Checking\u2026");
    return api("/api/birth")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (j) { if (adopt(j.doc || {})) setSync("ok", "Synced"); })
      .catch(handleSyncError);
  }

  function push() {
    if (!A.signedIn) { setSync("out", signedOutLabel()); return; }
    if (sync.busy) { sync.pending = true; return; }
    if (!navigator.onLine) { sync.pending = true; setSync("off", "Offline — saved on this phone"); return; }
    sync.busy = true; sync.pending = false;
    setSync("busy", "Saving\u2026");
    api("/api/birth", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ doc: D }),
      keepalive: true
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (j) { if (mergeInto(j.doc || {})) renderSafely(); setSync("ok", "Synced"); })
      .catch(handleSyncError)
      .then(function () { sync.busy = false; if (sync.pending) setTimeout(push, 2000); });
  }

  function schedulePush() {
    if (!A.signedIn) return;               // nothing to push to yet
    clearTimeout(sync.timer);
    sync.timer = setTimeout(push, 1000);
  }

  function mergeInto(remote) {
    var changed = false;
    for (var s in remote) {
      if (!D[s]) D[s] = {};
      var rs = remote[s];
      for (var k in rs) {
        var r = rs[k], mine = D[s][k];
        if (!r || typeof r.t !== "number") continue;
        if (!mine || r.t > mine.t) { D[s][k] = r; changed = true; }
      }
    }
    if (changed) saveDoc();
    return changed;
  }


  /* ---------------- custom content ----------------
     Items and plan options the two of you add or reword in the app.
     They live in the synced doc (section "custom"), so both phones see
     them and they merge exactly like answers do.
       custom.items           [{id,cat,name,how,got}]  your own items
       custom["ovi:"+id]      {name,how,got}           reword of a built-in item
       custom["opts:"+qkey]   [{v,label,say}]          your own options
       custom["ovo:"+qkey+":"+v]  {label,say}          reword of a built-in option */
  function customItems() {
    var v = get("custom", "items");
    return Array.isArray(v) ? v : [];
  }
  function byId(id) {
    if (BY[id]) return BY[id];
    var c = customItems();
    for (var i = 0; i < c.length; i++) if (c[i].id === id) return c[i];
    return null;
  }
  function eff(it) {
    var ov = get("custom", "ovi:" + it.id);
    if (!ov) return it;
    return { id: it.id, cat: it.cat, name: ov.name || it.name,
             how: ov.how || it.how, got: ov.got != null ? ov.got : it.got };
  }
  function itemsForCats(cats) {
    return ITEMS.concat(customItems()).filter(function (it) {
      return cats.indexOf(it.cat) >= 0;
    });
  }
  function customOpts(key) {
    var v = get("custom", "opts:" + key);
    return Array.isArray(v) ? v : [];
  }
  function allOpts(secId, q) {
    var key = qkey(secId, q);
    return (q.opts || []).map(function (o) {
      var ov = get("custom", "ovo:" + key + ":" + o.v);
      // A reword replaces the print line entirely: emptying it in the
      // editor is how an option is kept off the printout.
      return ov ? { v: o.v, label: ov.label || o.label, say: ov.say || undefined } : o;
    }).concat(customOpts(key).map(function (o) {
      return { v: o.v, label: o.label, say: o.say || o.label, custom: true };
    }));
  }

  /* ---------------- answers ---------------- */
  function qkey(secId, q) { return secId + "." + q.id; }

  function answerLines(secId, q) {
    var v = get("plan", qkey(secId, q));
    if (v == null || v === "") return [];
    if (q.type === "text" || q.type === "note") return [{ free: true, s: String(v) }];
    var picked = Array.isArray(v) ? v : [v];
    return allOpts(secId, q)
      .filter(function (o) { return picked.indexOf(o.v) >= 0 && o.say; })
      .map(function (o) { return { free: false, s: o.say }; });
  }

  function isAnswered(secId, q) {
    var v = get("plan", qkey(secId, q));
    return v != null && v !== "" && !(Array.isArray(v) && !v.length);
  }

  function stepProgress(i) {
    var st = STEPS[i];
    if (st.kind === "plan") {
      var done = st.qs.filter(function (q) { return isAnswered(st.id, q); }).length;
      return { done: done, total: st.qs.length };
    }
    var items = itemsForCats(st.cats);
    var m = items.filter(function (it) { return get("marks", it.id); }).length;
    return { done: m, total: items.length };
  }

  function dropStar(sk) { if (get("stars", sk)) set("stars", sk, null); }

  function starKeys() {
    var out = [];
    for (var k in D.stars) if (D.stars[k] && D.stars[k].v) out.push(k);
    return out;
  }

  function vetoWords() {
    return ["0", "1", "2"].map(function (i) { return (get("vetoes", i, "") || "").trim(); })
      .filter(Boolean);
  }

  /* ---------------- shared bits ---------------- */
  function resolve(trig) {
    // Custom items ride along with whichever triggers already cover
    // their category, listed after the built-ins unless marked yes.
    var cats = {};
    trig.items.forEach(function (id) { var it = byId(id); if (it) cats[it.cat] = 1; });
    var extra = customItems().filter(function (it) {
      return cats[it.cat] && trig.items.indexOf(it.id) < 0;
    });
    var live = trig.items.map(byId).concat(extra)
      .filter(function (it) { return it && get("marks", it.id) !== "veto"; });
    var pins = [];
    for (var i = 0; i < trig.items.length && pins.length < (trig.pin || 0); i++) {
      var it = byId(trig.items[i]);
      if (it && get("marks", it.id) !== "veto") pins.push(it);
    }
    var rest = live.filter(function (x) { return pins.indexOf(x) < 0; });
    var yes = rest.filter(function (x) { return get("marks", x.id) === "yes"; });
    var no = rest.filter(function (x) { return get("marks", x.id) !== "yes"; });
    return pins.concat(yes, no);
  }

  function vetoStrip() {
    var v = vetoWords();
    if (!v.length) return '<div class="vetobar empty">No vetoes written down</div>';
    return '<div class="vetobar"><b>NOT</b>' +
      v.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("") + "</div>";
  }
  function vetoRead() {
    var v = vetoWords();
    return '<section class="vetobox"><h2>She does not want</h2>' +
      (v.length ? '<ul class="vetolist">' + v.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"
                : '<div class="vetoempty">Nothing written down yet — fill this in on the Vetoes step.</div>') +
      "</section>";
  }

  function itemCard(it, withMarks) {
    it = eff(it);
    var m = get("marks", it.id);
    var dot = m === "yes" ? '<span class="dot"></span>' : m === "maybe" ? '<span class="dot m"></span>' : "";
    var h = '<article class="item' + (m === "veto" ? " vetoed" : "") + '">' +
      '<div class="nm">' + dot + "<span>" + esc(it.name) + "</span></div>" +
      '<div class="how">' + esc(it.how) + "</div>" +
      (it.got ? '<div class="got">' + esc(it.got) + "</div>" : "");
    if (withMarks) {
      h += '<button class="editpen" data-edit="' + esc(it.id) + '" title="Reword this">✎</button>' +
        '<div class="marks" data-item="' + esc(it.id) + '">' +
        ["yes", "maybe", "veto"].map(function (x) {
          return '<button data-m="' + x + '" aria-pressed="' + (m === x) + '">' + x.toUpperCase() + "</button>";
        }).join("") + "</div>";
    }
    return h + "</article>";
  }

  /* ---------------- plan wizard ---------------- */
  function renderWizardHome() {
    var totalQ = 0, doneQ = 0;
    STEPS.forEach(function (_, i) { var p = stepProgress(i); totalQ += p.total; doneQ += p.done; });
    var pct = totalQ ? Math.round((doneQ / totalQ) * 100) : 0;
    var resume = L.step != null ? L.step : firstUnfinished();

    var h = '<div class="prepnote">Work through this with Britt whenever you have twenty minutes — ' +
      "in order, or by tapping any step below; nothing cares about the sequence. " +
      "It saves as you go and syncs to both phones. The point of all of it is the two printouts: " +
      "a one-page birth plan for the care team, and your comfort pocket sheet.</div>" +
      '<div class="prog"><i style="width:' + pct + '%"></i></div>' +
      '<div class="tally"><span><b>' + doneQ + "</b> of <b>" + totalQ + "</b> answered</span>" +
      "<span><b>" + starKeys().length + "</b>/3 starred</span></div>" +
      '<button class="bigbtn" data-step="' + resume + '">' +
      (doneQ ? "CONTINUE — " + esc(STEPS[resume].title) : "START") + "</button>";

    h += '<div class="chapter">Birth plan — for the care team</div>' + stepRows(0, PLAN_STEPS);
    h += '<div class="chapter">Comfort measures — for me</div>' + stepRows(PLAN_STEPS, STEPS.length);
    h += '<button class="ghostbtn" id="btnPrint2">PRINT / EXPORT</button>';
    return h;
  }

  function stepRows(from, to) {
    var out = '<div class="steplist">';
    for (var i = from; i < to; i++) {
      var p = stepProgress(i);
      var cls = p.done === 0 ? "" : p.done >= p.total ? " done" : " part";
      out += '<button class="steprow' + cls + '" data-step="' + i + '">' +
        '<span class="ring">' + (p.done >= p.total ? "✓" : p.done ? "•" : "") + "</span>" +
        "<span>" + esc(STEPS[i].title) + "</span>" +
        '<span class="cnt">' + p.done + "/" + p.total + " &rsaquo;</span></button>";
    }
    return out + "</div>";
  }

  function openJumpModal() {
    openModal("<h2>Jump to any step</h2>" +
      '<div class="chapter">Birth plan — for the care team</div>' + stepRows(0, PLAN_STEPS) +
      '<div class="chapter">Comfort measures — for me</div>' + stepRows(PLAN_STEPS, STEPS.length) +
      '<div class="rowbtns"><button class="closebtn" id="modalClose">CLOSE</button></div>');
  }

  function firstUnfinished() {
    for (var i = 0; i < STEPS.length; i++) {
      var p = stepProgress(i);
      if (p.done < p.total) return i;
    }
    return 0;
  }

  function renderQuestion(secId, q) {
    var key = qkey(secId, q);
    var v = get("plan", key);
    var starred = !!get("stars", key);
    var freeform = q.type === "text" || q.type === "note";

  /* ---------------- wave timer ----------------
     Mindful Birthing, made concrete: time the waves themselves, learn
     how long hers actually run, then translate that into breaths. She
     never has to do all of labor — only this wave, and a wave she can
     count in breaths is a wave with an end. Local to this phone, like
     the pee timer: the phone in the room is the one doing the timing. */
  var BREATH = 8000;   // one slow relaxed breath, ~8 seconds

  function mmss(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2);
  }
  function breathsIn(ms) { return Math.max(1, Math.round(ms / BREATH)); }

  function waveStats() {
    var W = L.waves, n = W.length, i;
    var d = 0, durN = Math.min(n, 6);
    for (i = n - durN; i < n; i++) d += W[i].e - W[i].s;
    var g = 0, gapN = 0;
    for (i = Math.max(1, n - 6); i < n; i++) { g += W[i].s - W[i - 1].s; gapN++; }
    var hourAgo = Date.now() - 3600000;
    var recent = W.filter(function (w) { return w.s >= hourAgo; });
    var rd = 0, rg = 0, rgN = 0;
    recent.forEach(function (w) { rd += w.e - w.s; });
    for (i = 1; i < recent.length; i++) { rg += recent[i].s - recent[i - 1].s; rgN++; }
    return {
      avgDur: durN ? d / durN : null,
      avgGap: gapN ? g / gapN : null,
      fiveOneOne: recent.length >= 10 && rgN > 0 &&
        rg / rgN <= 5.5 * 60000 && rd / recent.length >= 50000
    };
  }

  function renderWaves() {
    var st = waveStats();
    if (L.waveOn != null) {
      return '<div class="wavehero">' +
        '<div class="pacer"><i></i></div>' +
        '<div class="pacecap">in as it grows &middot; out as it lets go</div>' +
        '<div class="waveclock" id="waveClock">0:00</div>' +
        '<div class="wavesub" id="waveBreaths">breath 1</div>' +
        '<div class="wavehint" id="waveHint"></div></div>' +
        '<button class="wavebig end" id="waveEnd">IT&rsquo;S EASING &mdash; TAP</button>' +
        '<div class="blurb">Go quiet. Pressure on, breathe where she can see you. ' +
        "The clock is for you — she gets the breaths, not the numbers.</div>";
    }

    var h = '<button class="wavebig" id="waveStart">A WAVE IS STARTING &mdash; TAP</button>';
    if (!L.waves.length) {
      return h + '<div class="blurb">Tap when a wave starts, tap again when it eases. ' +
        "After a few, this screen knows how long hers actually run — and turns it into " +
        "breaths: a 70-second wave is about 9 slow breaths.</div>" +
        '<div class="hint">From Mindful Birthing: she never has to do all of labor, only this one wave — ' +
        "and once you've timed a few, “this one” has a number. In early labor, time a " +
        "20-minute stretch every couple of hours, not all day. Rehearsal: a minute of ice in her fist.</div>";
    }

    h += '<div class="wavecard"><div class="restclock" id="restClock"></div>' +
      '<div class="dim">That one is over — completely. Nothing is happening right now. ' +
      "Rest with her; don’t spend the break bracing for the next one.</div></div>";

    if (st.avgDur) {
      h += '<div class="wavecard"><b>Her waves right now</b>' +
        "<p>About <b>" + Math.round(st.avgDur / 1000) + "s</b> long — roughly <b>" +
        breathsIn(st.avgDur) + " slow breaths</b> and it’s over." +
        (st.avgGap ? " Coming about <b>" + mmss(st.avgGap) + "</b> apart." : "") + "</p>" +
        '<p class="dim">Say the math out loud between waves — “yours are about ' +
        breathsIn(st.avgDur) + " breaths”. A wave she can count is a wave with an end.</p></div>";
    }

    h += st.fiveOneOne
      ? '<div class="rule">This is 5-1-1 — about 5 minutes apart, a minute long, for an hour. Time to call.</div>'
      : '<div class="hint">Call at 5-1-1: 5 min apart, 1 min long, for 1 hour — confirm the rule with her provider.</div>';

    var rows = L.waves.slice(-8), out = "";
    for (var i = rows.length - 1; i >= 0; i--) {
      var w = rows[i];
      var at = new Date(w.s);
      var gap = i > 0 ? mmss(w.s - rows[i - 1].s) + " after the last" :
        (L.waves.length > rows.length ? "" : "first one timed");
      out += "<tr><td>" + ("0" + at.getHours()).slice(-2) + ":" + ("0" + at.getMinutes()).slice(-2) +
        "</td><td>" + Math.round((w.e - w.s) / 1000) + "s &middot; ~" + breathsIn(w.e - w.s) +
        " breaths</td><td>" + gap + "</td></tr>";
    }
    h += '<div class="wavecard"><b>Last waves</b><table class="wavelog">' + out + "</table></div>" +
      '<div class="rowbtns"><button id="waveUndo">UNDO LAST</button>' +
      '<button id="waveClear">CLEAR ALL</button></div>';
    return h;
  }

  function tickWave() {
    if (L.waveOn != null) {
      var el = document.getElementById("waveClock");
      if (!el) return;
      var ms = Date.now() - L.waveOn;
      el.textContent = mmss(ms);
      document.getElementById("waveBreaths").textContent = "breath " + Math.max(1, Math.ceil(ms / BREATH));
      var avg = waveStats().avgDur, hint;
      if (ms > 180000) hint = "Over three minutes — if this got left running, tap below and UNDO.";
      else if (!avg) hint = "Waves usually run about a minute — six to nine slow breaths.";
      else if (ms < avg * 0.45) hint = "Building — hers have been about " + breathsIn(avg) + " breaths.";
      else if (ms < avg * 0.8) hint = "Around the peak — it comes down from here.";
      else if (ms < avg * 1.15) hint = "Coming down — nearly done.";
      else hint = "Longer than her average — it still ends.";
      document.getElementById("waveHint").textContent = hint;
    } else {
      var rc = document.getElementById("restClock");
      if (!rc) return;
      var last = L.waves[L.waves.length - 1];
      if (last) rc.textContent = mmss(Date.now() - last.e) + " since it ended";
    }
  }

  /* ---------------- print: comfort pocket sheet ---------------- */
  function buildSheetPrint() {
    var v = vetoWords();
    var h = '<div class="ph"><b>LABOR SUPPORT — BRITT</b><span>JOYCE STOCK SNUGGERY · GLENS FALLS</span></div>';
    h += '<div class="pveto"><b>SHE DOES NOT WANT</b>' +

      "</div>";

      "<p><b>On arrival:</b> " + JOBS.arrival.map(function (j) { return j[1].toLowerCase(); }).join(" · ") + "</p>" +

  /* ---------------- print: the birth plan (one page, for the care team) ---------------- */
  function buildPlanPrint() {
    var names = get("plan", "basics.names", "") || "Our birth plan";
    var due = get("plan", "basics.due", "");
    var prov = get("plan", "basics.provider", "");
    var supp = get("plan", "basics.support", "");
    var health = get("plan", "basics.health", "");

    var h = '<div class="ph"><b>' + esc(names) + "</b><span>BIRTH PLAN</span></div>";

    var who = [];
    if (due) who.push("<span><b>Due:</b> " + esc(due) + "</span>");
    if (prov) who.push("<span><b>Provider:</b> " + esc(prov) + "</span>");
    if (supp) who.push("<span><b>With me:</b> " + esc(supp) + "</span>");
    who.push("<span><b>Where:</b> Joyce Stock Snuggery, Glens Falls Hospital</span>");
    h += '<div class="who">' + who.join("") + "</div>";

    // the two things a nurse should read if they read nothing else
    var stars = starKeys().map(function (k) {
      var opt = null, base = k;
      var colon = k.indexOf(":");
      if (colon > 0) { opt = k.slice(colon + 1); base = k.slice(0, colon); }
      var parts = base.split("."), sec = SECT[parts[0]];
      if (!sec) return null;
      var q = sec.qs.filter(function (x) { return x.id === parts[1]; })[0];
      if (!q) return null;
      if (opt) {
        var o = allOpts(parts[0], q).filter(function (x) { return x.v === opt; })[0];
        return o && o.say ? o.say : null;
      }
      var lines = answerLines(parts[0], q);
      return lines.length ? lines[0].s : null;   // one line, never a paragraph
    }).filter(Boolean);
    var vet = vetoWords();

    if (stars.length || vet.length) {
      h += '<div class="boxes">';
      if (stars.length) {
        h += '<div class="box"><b>MOST IMPORTANT TO US</b><ul>' +
          stars.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
      }
      if (vet.length) {
        h += '<div class="box' + (stars.length ? " half" : "") + '"><b>PLEASE DON\'T</b><ul>' +
          vet.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
      }
      h += "</div>";
    }

    if (health) {
      h += '<div class="note"><b>PLEASE KNOW:</b> ' + esc(health) + "</div>";
    }

    h += '<div class="cols">' + PLAN_PRINT.map(function (secId) {
      var sec = SECT[secId];
      if (!sec) return "";
      var body = "";
      sec.qs.forEach(function (q) {
        answerLines(secId, q).forEach(function (l) {
          body += '<p class="' + (l.free ? "free" : "") + '">' +
            (l.free ? "<b>" + esc(q.printAs || q.q) + ":</b> " : "") + esc(l.s) + "</p>";
        });
      });
      return body ? '<div class="sec"><h3>' + esc(sec.title) + "</h3>" + body + "</div>" : "";
    }).join("") + "</div>";

    var closeQ = SECT.closing.qs[0];
    var closing = get("plan", "closing.words", "") || closeQ.ph;
    h += '<div class="close">' + esc(closing) + "</div>";
    h += '<div class="ft">brooker.family/birth · ' + new Date().toLocaleDateString() + "</div>";

    document.getElementById("planprint").innerHTML = h;
  }

  function render(keepScroll) {
    var y = window.scrollY;
    ["plan", "room"].forEach(function (m) {
      document.getElementById("m" + m[0].toUpperCase() + m.slice(1))
        .setAttribute("aria-pressed", L.mode === m);
    });

    var brand = document.getElementById("brand");
    var wavesOpen = L.mode === "room" && L.trig === "__waves";
    var openTrig = L.mode === "room" && L.trig && !wavesOpen
      ? TRIGGERS.filter(function (x) { return x.id === L.trig; })[0] : null;
    var inStep = L.mode === "plan" && L.step != null;
    // The pressed mode button already names the mode -- the brand slot is
    // worth more as the trigger name / step counter than as a duplicate label.
    brand.textContent = wavesOpen ? "Waves"
      : openTrig ? (openTrig.short || openTrig.name)
      : inStep ? (L.step + 1) + "/" + STEPS.length : "";
    brand.classList.toggle("open", !!openTrig || wavesOpen);

    var body = L.mode === "room" ? renderRoom() : renderPlan();
    app.innerHTML = (L.authMsg ? authNotice() : "") + body;

    var running = L.peeStart != null;
    btnBack.classList.toggle("hidden", !(openTrig || inStep || wavesOpen));
    btnNext.classList.toggle("hidden", !inStep);
    btnPee.classList.toggle("hidden", inStep && !running);
    document.getElementById("btnJob").classList.toggle("hidden", inStep);
    if (inStep) btnNext.textContent = L.step >= STEPS.length - 1 ? "DONE ✓" : "NEXT ▶";
    document.querySelector(".bar").classList.remove("hidden");

    buildPrint();
    tickPee();
    tickWave();
    if (keepScroll) window.scrollTo(0, y);
    saveLoc();
  }

  // A sync pull mustn't yank the keyboard out from under someone mid-sentence.

    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
    render(true);
  }

  function goStep(i) {
    L.step = Math.max(0, Math.min(STEPS.length - 1, i));

    else if (L.step === 0) { L.step = null; render(); }

    if (e.target.closest("[data-waves]")) { L.trig = "__waves"; render(); window.scrollTo(0, 0); return; }
    if (e.target.closest("#waveStart")) { L.waveOn = Date.now(); saveLoc(); render(true); return; }
    if (e.target.closest("#waveEnd")) {
      // Anything under 10s was a mis-tap, not a contraction.
      if (Date.now() - L.waveOn >= 10000) {
        L.waves.push({ s: L.waveOn, e: Date.now() });
        if (L.waves.length > 60) L.waves = L.waves.slice(-60);
      }
      L.waveOn = null; saveLoc(); render(true); return;
    }
    if (e.target.closest("#waveUndo")) { L.waves.pop(); saveLoc(); render(true); return; }
    if ((el = e.target.closest("#waveClear"))) {
      if (el.getAttribute("data-armed")) { L.waves = []; saveLoc(); render(true); }
      else { el.setAttribute("data-armed", "1"); el.textContent = "TAP AGAIN TO CLEAR"; }

    if ((el = e.target.closest("[data-edit]"))) { openItemEditor(el.getAttribute("data-edit"), null); return; }

    if ((el = e.target.closest("[data-trig]"))) { L.trig = el.getAttribute("data-trig"); render(); window.scrollTo(0, 0); return; }
    if ((el = e.target.closest("[data-m]"))) {

      set("marks", itemId, get("marks", itemId) === val ? null : val);

    if ((el = e.target.closest("[data-opt]"))) {
      var key = el.getAttribute("data-q"), v = el.getAttribute("data-opt");
      if (el.getAttribute("data-multi") === "true") {
        var cur = get("plan", key); cur = Array.isArray(cur) ? cur.slice() : [];
        var at = cur.indexOf(v);
        if (at >= 0) { cur.splice(at, 1); dropStar(key + ":" + v); } else cur.push(v);
        set("plan", key, cur);

        var was = get("plan", key);

  modal.addEventListener("click", function (e) {

      if (edit && edit.kind === "optedit") openOptMgr(edit.secId, edit.q);
      else closeModal();
      return;
    }
    if (e.target.closest("#edSave")) {
      if (edit && edit.kind === "optedit") saveOptEdit();
      else if (edit && edit.kind === "item") saveItemEdit();
      return;
    }
    if (e.target.closest("#edReset")) {
      if (edit && edit.kind === "optedit") {
        set("custom", "ovo:" + edit.key + ":" + edit.v, null);
        render(true); openOptMgr(edit.secId, edit.q);
      } else if (edit && edit.kind === "item") {
        set("custom", "ovi:" + edit.id, null);
        closeModal(); render(true);
      }
      return;
    }
    if (e.target.closest("#edDelete")) {
      if (edit && edit.kind === "optedit") {
        var key = edit.key, dv = edit.v;
        set("custom", "opts:" + key, customOpts(key).filter(function (o) { return o.v !== dv; }));
        var cur = get("plan", key);
        if (Array.isArray(cur)) {
          var at = cur.indexOf(dv);
          if (at >= 0) { cur = cur.slice(); cur.splice(at, 1); set("plan", key, cur); }
        } else if (cur === dv) set("plan", key, null);
        dropStar(key + ":" + dv);
        render(true); openOptMgr(edit.secId, edit.q);
      } else if (edit && edit.kind === "item") {
        set("custom", "items", customItems().filter(function (i) { return i.id !== edit.id; }));
        set("marks", edit.id, null);
        closeModal(); render(true);

      return;

    var p = e.target.closest("[data-print]");
    if (p) { closeModal(); setTimeout(function () { doPrint(p.getAttribute("data-print")); }, 60); return; }

        .then(function () { cb.textContent = "COPIED ✓"; })
        .catch(function () { cb.textContent = "SELECTED — COPY IT"; });
      return;

    if (e.target.closest("#btnDownloadBackup")) {
      var blob = new Blob([backupText()], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "birth-plan-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return;
    }

    if (e.target.closest("#btnRestore")) {
      var msg = document.getElementById("backupMsg");
      var raw = document.getElementById("restoreBox").value.trim();
      var parsed;
      try { parsed = JSON.parse(raw); } catch (err) { parsed = null; }
      if (!parsed || !parsed.doc) {
        msg.innerHTML = '<div class="err">That doesn\'t look like a backup.</div>';
        return;
      }
      mergeInto(parsed.doc);
      if (parsed.jobs) { L.jobs = parsed.jobs; }
      saveDoc(); saveLoc(); closeModal(); render(true);
      if (A.signedIn) schedulePush();
      return;
    }

    if (e.target.closest("#btnSignIn")) { location.href = "/api/birth/auth/start"; return; }

    if (e.target.closest("#btnSignOut")) {
      api("/api/birth/auth/signout", { method: "POST" }).then(function () {
        A = { signedIn: false, configured: true, email: null, role: null, members: [] };
        L.account = null; delete L.mergedWith; saveLoc();
        sync.decided = false;
        closeModal(); setSync("out", signedOutLabel()); render(true);
      });
      return;
    }

    if (e.target.closest("#btnInvite")) {
      var input = document.getElementById("inviteEmail");
      var msg = document.getElementById("acctMsg");
      var btn = e.target.closest("#btnInvite");
      btn.textContent = "ADDING\u2026";
      api("/api/birth/members", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: input.value })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) {
            msg.innerHTML = '<div class="err">' + esc(res.j.error || "Couldn't add that address") + "</div>";
            btn.textContent = "ADD TO THIS PLAN"; return;
          }
          A.members = res.j.members; openAccount();
        })
        .catch(function () {
          msg.innerHTML = '<div class="err">No connection.</div>';
          btn.textContent = "ADD TO THIS PLAN";
        });
      return;
    }

    var drop = e.target.closest("[data-drop]");
    if (drop) {
      api("/api/birth/members?email=" + encodeURIComponent(drop.getAttribute("data-drop")),
          { method: "DELETE" })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j.members) { A.members = j.members; openAccount(); } });
      return;
    }

    var imp = e.target.closest("[data-import]");
    if (imp) {
      var remote = pendingRemote || {};
      if (imp.getAttribute("data-import") === "theirs") {
        D = { marks: {}, plan: {}, vetoes: {}, stars: {}, custom: {} };
      }
      mergeInto(remote);
      sync.decided = true;
      L.mergedWith = A.email;
      saveDoc(); saveLoc(); closeModal(); render(true);
      push();
      return;
    }
  });

  /* ---------------- hourly pee nudge (visual only, no sound) ---------------- */
  var HOUR = 3600000;
  var peeFlashUntil = 0;

  function sinceLabel(ms) {
    var sec = Math.floor(ms / 1000);
    if (sec < 60) return sec + "s";
    var min = Math.floor(sec / 60);
    if (min < 60) return min + "m";
    return Math.floor(min / 60) + "h" + ("0" + (min % 60)).slice(-2);
  }

  function tickPee() {
    if (Date.now() < peeFlashUntil) return;      // leave the tap confirmation up
    if (L.peeStart == null) {
      btnPee.textContent = "START PEE TIMER";
      btnPee.classList.remove("due");
      return;
    }
    var ms = Date.now() - L.peeStart, due = ms >= HOUR;
    btnPee.textContent = (due ? "▸ PEE  " : "PEE  ") + sinceLabel(ms);
    btnPee.classList.toggle("due", due);
  }

  // A tap means "she just went" -- restart the hour. It used to do this
  // silently, which looked identical to nothing happening.
  btnPee.onclick = function () {
    var wasRunning = L.peeStart != null;
    L.peeStart = Date.now();
    saveLoc();
    btnPee.classList.remove("due");
    btnPee.textContent = wasRunning ? "RESET ✓" : "STARTED ✓";
    peeFlashUntil = Date.now() + 1400;
    setTimeout(function () { peeFlashUntil = 0; tickPee(); render(true); }, 1400);
  };

  setInterval(function () { if (!document.hidden) { tickPee(); tickWave(); } }, 1000);

  /* ---------------- lifecycle ---------------- */
  window.addEventListener("beforeprint", buildPrint);
  window.addEventListener("online", function () { refreshAccount().then(pull).then(push); });
  window.addEventListener("offline", function () { setSync("off", "Offline — saved on this phone"); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (sync.pending) push(); }
    else { tickPee(); tickWave(); pull(); }
  });
  setInterval(function () { if (!document.hidden) pull(); }, 90000);

  (function readAuthResult() {
    var m = /[?&]auth=([a-z_]+)/.exec(location.search);
    if (!m) return;
    L.authMsg = m[1]; saveLoc();
    if (history.replaceState) history.replaceState(null, "", location.pathname);
  })();

  render();
  setSync("busy", "Checking…");
  refreshAccount()
    .then(function () { render(true); return pull(); })
    .then(function () { if (sync.pending) push(); });

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    navigator.serviceWorker.register("/birth-sw.js", { scope: "/birth" }).catch(function () {});
  }
})();
</script>
</body>
